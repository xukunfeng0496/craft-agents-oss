# CVTE build pipeline — runs on the GitHub mirror (public runners can't reach
# the CVTE intranet, so this publishes a GitHub Release; the fast-update-server
# sync happens from an intranet machine afterwards via
# `bun run fast-update:upload` or the /sync-to-fast-update command).
name: Build

on:
  push:
    branches:
      - cvte/main
  workflow_dispatch:

env:
  # Baked into the main bundle by scripts/electron-build-main.ts — without
  # these the packaged app falls back to electron-builder.yml's publish.url
  # (also pointed at the CVTE server as a second line of defense).
  AUTO_UPDATE_SERVER_URL: http://rxpc.gz.cvte.cn/fast-update-server
  AUTO_UPDATE_PRODUCT_ID: work-agents
  AUTO_UPDATE_CHANNEL: stable
  AUTO_UPDATE_SILENT: "1"

jobs:
  build-mac:
    runs-on: macos-latest
    env:
      NODE_OPTIONS: --max-old-space-size=4096
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      - name: Install dependencies
        run: bun install
        # @vscode/ripgrep's postinstall downloads the rg binary from GitHub
        # releases; unauthenticated runner requests get rate-limited (403).
        # Authenticate with the Actions token to lift the limit.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # D4: Apple Silicon only — darwin-x64 is frozen at v0.7.1 and never built
      - name: Build macOS DMG (arm64)
        run: bash apps/electron/scripts/build-dmg.sh arm64

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mac-dmg
          path: |
            apps/electron/release/Craft-Agents-arm64.dmg
            apps/electron/release/Craft-Agents-arm64.zip
            apps/electron/release/latest-mac.yml
            apps/electron/release/*.blockmap

  build-win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      - name: Install dependencies
        run: bun install

      - name: Build Windows installer
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File apps/electron/scripts/build-win.ps1

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: win-installer
          path: |
            apps/electron/release/*.exe
            apps/electron/release/latest.yml
            apps/electron/release/*.blockmap

  release:
    needs: [build-mac, build-win]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Get version
        id: version
        run: |
          VERSION=$(grep '"version"' apps/electron/package.json | head -1 | sed 's/.*"version": *"\([^"]*\)".*/\1/')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # Single mac arch (D4) — the latest-mac.yml from electron-builder is
      # already correct; the old multi-arch merge step is gone for good.

      - name: Delete existing release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: gh release delete "v$VERSION" --yes --cleanup-tag || true

      - name: Write release notes
        run: |
          cat > .release-notes.md << 'HEADER'

          | 平台 | 文件 |
          |------|------|
          | macOS Apple Silicon | `Craft-Agents-arm64.dmg` |
          | Windows x64 | `Craft-Agents-x64.exe` |

          > **macOS 提示**：如安装时提示无法打开，请右键点击 DMG 选择「打开」，或在「系统设置 → 隐私与安全性」中允许。
          > macOS Intel 用户请继续使用 v0.7.1（该架构已冻结，不再更新）。

          ---

          HEADER

          if [ -f apps/electron/RELEASE_NOTES.md ]; then
            cat apps/electron/RELEASE_NOTES.md >> .release-notes.md
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          body_path: .release-notes.md
          files: artifacts/**/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
