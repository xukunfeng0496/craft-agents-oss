name: Build

on:
  push:
    branches:
      - cvte/main
  workflow_dispatch:

jobs:
  build-mac:
    runs-on: macos-latest
    env:
      NODE_OPTIONS: --max-old-space-size=4096
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5

      - name: Install dependencies
        run: bun install

      - name: Build macOS DMG (arm64)
        run: bash apps/electron/scripts/build-dmg.sh arm64

      - name: Build macOS DMG (x64)
        run: bash apps/electron/scripts/build-dmg.sh x64

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mac-dmg
          path: |
            apps/electron/release/*.dmg
            apps/electron/release/*.zip
            apps/electron/release/latest-mac.yml
            apps/electron/release/*.blockmap

  build-win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5

      - name: Install dependencies
        run: bun install

      - name: Build Windows installer
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File apps/electron/scripts/build-win.ps1

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: win-installer
          path: |
            apps/electron/release/*.exe
            apps/electron/release/latest.yml
            apps/electron/release/*.blockmap

  build-linux:
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools rpm
          bun install

      - name: Build Linux AppImage
        run: bash apps/electron/scripts/build-linux.sh x64

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: |
            apps/electron/release/*.AppImage
            apps/electron/release/latest-linux.yml
            apps/electron/release/*.blockmap

  release:
    needs: [build-mac, build-win, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Get version
        id: version
        run: |
          VERSION=$(cat apps/electron/package.json | grep '"version"' | head -1 | sed 's/.*"version": *"\([^"]*\)".*/\1/')
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Merge latest-mac.yml for multi-arch support
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          MAC_DIR="artifacts/mac-dmg"

          echo "=== Merging latest-mac.yml for multi-arch support ==="
          echo "Directory contents:"
          ls -la "$MAC_DIR/"

          # Get sha512 and size for each architecture from the zip files
          ARM64_ZIP="$MAC_DIR/Work-Agent-${VERSION}-osx-arm64.zip"
          X64_ZIP="$MAC_DIR/Work-Agent-${VERSION}-osx-x64.zip"

          # Calculate sha512 for arm64 (hex to base64)
          if [ -f "$ARM64_ZIP" ]; then
            ARM64_SHA512=$(sha512sum "$ARM64_ZIP" | awk '{print $1}' | xxd -r -p | base64 -w0)
            ARM64_SIZE=$(stat -c%s "$ARM64_ZIP")
            echo "arm64: sha512=${ARM64_SHA512:0:20}..., size=$ARM64_SIZE"
          else
            echo "ERROR: $ARM64_ZIP not found"
            exit 1
          fi

          # Calculate sha512 for x64 (hex to base64)
          if [ -f "$X64_ZIP" ]; then
            X64_SHA512=$(sha512sum "$X64_ZIP" | awk '{print $1}' | xxd -r -p | base64 -w0)
            X64_SIZE=$(stat -c%s "$X64_ZIP")
            echo "x64: sha512=${X64_SHA512:0:20}..., size=$X64_SIZE"
          else
            echo "ERROR: $X64_ZIP not found"
            exit 1
          fi

          # Validate hashes were calculated
          if [ -z "$ARM64_SHA512" ] || [ -z "$X64_SHA512" ]; then
            echo "ERROR: Failed to calculate SHA512 hashes"
            exit 1
          fi

          # Get current date in ISO format (using simple format for portability)
          RELEASE_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          # Create merged latest-mac.yml with both architectures
          # electron-updater uses 'files' array and detects arch from URL pattern
          # Use printf to avoid heredoc indentation issues
          printf '%s\n' \
            "version: $VERSION" \
            "files:" \
            "  - url: Work-Agent-${VERSION}-osx-arm64.zip" \
            "    sha512: $ARM64_SHA512" \
            "    size: $ARM64_SIZE" \
            "  - url: Work-Agent-${VERSION}-osx-x64.zip" \
            "    sha512: $X64_SHA512" \
            "    size: $X64_SIZE" \
            "path: Work-Agent-${VERSION}-osx-arm64.zip" \
            "sha512: $ARM64_SHA512" \
            "releaseDate: $RELEASE_DATE" \
            > "$MAC_DIR/latest-mac.yml"

          echo "=== Generated latest-mac.yml ==="
          cat "$MAC_DIR/latest-mac.yml"

          # Validate YAML is parseable
          python3 -c "import yaml; yaml.safe_load(open('$MAC_DIR/latest-mac.yml'))" && echo "YAML validation passed"

      - name: Delete existing release
        run: gh release delete "v${{ steps.version.outputs.version }}" --yes --cleanup-tag || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Write release notes
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          # Build final release notes: install table (auto) + changelog (from file)
          cat > .release-notes.md << HEADER
          ## 安装

          | 平台 | 文件 |
          |------|------|
          | macOS Apple Silicon | \`Work-Agent-${VERSION}-osx-arm64.dmg\` |
          | macOS Intel | \`Work-Agent-${VERSION}-osx-x64.dmg\` |
          | Windows x64 | \`Work-Agent-${VERSION}-windows-x64.exe\` |
          | Linux x64 | \`Work-Agent-${VERSION}-linux-x64.AppImage\` |

          > **macOS 提示**：如安装时提示无法打开，请右键点击 DMG 选择「打开」，或在「系统设置 → 隐私与安全性」中允许。

          ---

          HEADER

          # Append changelog from RELEASE_NOTES.md if it exists
          if [ -f apps/electron/RELEASE_NOTES.md ]; then
            cat apps/electron/RELEASE_NOTES.md >> .release-notes.md
          else
            echo "⚠ apps/electron/RELEASE_NOTES.md not found, using minimal notes"
            echo "## v${VERSION}" >> .release-notes.md
          fi

          echo "" >> .release-notes.md
          echo "---" >> .release-notes.md
          echo "" >> .release-notes.md
          echo "Work Agents · Apache 2.0" >> .release-notes.md

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          body_path: .release-notes.md
          files: artifacts/**/*
          draft: false
          prerelease: false
