name: Build

on:
  push:
    branches:
      - cvte/main
  workflow_dispatch:

jobs:
  build-mac:
    runs-on: macos-latest
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5

      - name: Install dependencies
        run: bun install

      - name: Build macOS DMG (arm64)
        run: bash apps/electron/scripts/build-dmg.sh arm64

      - name: Build macOS DMG (x64)
        run: bash apps/electron/scripts/build-dmg.sh x64

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mac-dmg
          path: |
            apps/electron/release/*.dmg
            apps/electron/release/*.zip
            apps/electron/release/latest-mac.yml
            apps/electron/release/*.blockmap

  build-win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5

      - name: Install dependencies
        run: bun install

      - name: Build Windows installer
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File apps/electron/scripts/build-win.ps1

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: win-installer
          path: |
            apps/electron/release/*.exe
            apps/electron/release/latest.yml
            apps/electron/release/*.blockmap

  build-linux:
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools rpm
          bun install

      - name: Build Linux AppImage
        run: bash apps/electron/scripts/build-linux.sh x64

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: |
            apps/electron/release/*.AppImage
            apps/electron/release/latest-linux.yml
            apps/electron/release/*.blockmap

  release:
    needs: [build-mac, build-win, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Get version
        id: version
        run: |
          VERSION=$(cat apps/electron/package.json | grep '"version"' | head -1 | sed 's/.*"version": *"\([^"]*\)".*/\1/')
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Delete existing release
        run: gh release delete "v${{ steps.version.outputs.version }}" --yes --cleanup-tag || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Write release notes
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          cat > .release-notes.md << EOF
          ## 安装

          | 平台 | 文件 |
          |------|------|
          | macOS Apple Silicon | \`Work-Agent-${VERSION}-osx-arm64.dmg\` |
          | macOS Intel | \`Work-Agent-${VERSION}-osx-x64.dmg\` |
          | Windows x64 | \`Work-Agent-${VERSION}-windows-x64.exe\` |
          | Linux x64 | \`Work-Agent-${VERSION}-linux-x64.AppImage\` |

          > **macOS 提示**：此版本暂未进行 Apple 公证，安装时需在「系统设置 → 隐私与安全性」中手动允许，或右键点击 DMG 选择「打开」。

          ---

          ## v${VERSION} 更新内容

          ### 性能优化
          - **macOS 省电**：窗口隐藏时降低 GPU 渲染频率，减少后台能耗
          - **Apple Silicon 优化**：修复 arm64 安装包中混入 x64 二进制的问题，完全消除 Rosetta 转译开销

          ### 修复
          - **认证稳定性**：修复 SDK Keychain OAuth 凭证冲突导致的请求头错误，解决部分用户登录态异常的问题
          - **界面文字**：修复菜单栏中未翻译的硬编码字符串
          - **对话压缩提示**：确保压缩完成消息始终正确显示
          - **构建**：修复多架构打包时文件被错误覆盖的问题

          ---

          Work Agents · Apache 2.0
          EOF

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          body_path: .release-notes.md
          files: artifacts/**/*
          draft: false
          prerelease: false
