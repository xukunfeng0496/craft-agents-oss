name: Build

on:
  push:
    branches:
      - cvte/main
  workflow_dispatch:

jobs:
  build-mac:
    runs-on: macos-latest
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5

      - name: Install dependencies
        run: bun install

      - name: Build macOS DMG (arm64)
        run: bash apps/electron/scripts/build-dmg.sh arm64

      - name: Build macOS DMG (x64)
        run: bash apps/electron/scripts/build-dmg.sh x64

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mac-dmg
          path: |
            apps/electron/release/*.dmg
            apps/electron/release/*.zip
            apps/electron/release/latest-mac.yml
            apps/electron/release/*.blockmap

  build-win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5

      - name: Install dependencies
        run: bun install

      - name: Build Windows installer
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File apps/electron/scripts/build-win.ps1

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: win-installer
          path: |
            apps/electron/release/*.exe
            apps/electron/release/latest.yml
            apps/electron/release/*.blockmap

  build-linux:
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools rpm
          bun install

      - name: Build Linux AppImage
        run: bash apps/electron/scripts/build-linux.sh x64

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: |
            apps/electron/release/*.AppImage
            apps/electron/release/latest-linux.yml
            apps/electron/release/*.blockmap

  release:
    needs: [build-mac, build-win, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Get version
        id: version
        run: |
          VERSION=$(cat apps/electron/package.json | grep '"version"' | head -1 | sed 's/.*"version": *"\([^"]*\)".*/\1/')
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Delete existing release
        run: gh release delete "v${{ steps.version.outputs.version }}-cvte" --yes --cleanup-tag || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Write release notes
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          cat > .release-notes.md << EOF
          # v${VERSION} (CVTE Build)

          ## Install

          | Platform | File |
          |----------|------|
          | macOS Apple Silicon | \`Work-Agent-osx-arm64.dmg\` |
          | macOS Intel | \`Work-Agent-osx-x64.dmg\` |
          | Windows x64 | \`Work-Agent-windows-x64.exe\` |
          | Linux x64 | \`Work-Agent-linux-x64.AppImage\` |

          ---

          Built from [craft-agents-oss](https://github.com/xukunfeng0496/craft-agents-oss) · Apache 2.0
          EOF

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}-cvte
          name: v${{ steps.version.outputs.version }} (CVTE Build)
          body_path: .release-notes.md
          files: artifacts/**/*
          draft: false
          prerelease: false
