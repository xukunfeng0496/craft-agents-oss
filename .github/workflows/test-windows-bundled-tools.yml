name: Test Windows Bundled Tools

# Verifies the bundled Windows toolchain (MinGit + embedded Python) downloads and
# stages correctly, and that the tree still type-checks / passes tests. Runs on
# changes under apps/electron, or on demand. No untrusted event input is used.
on:
  push:
    branches:
      - cvte/main
    paths:
      - 'apps/electron/scripts/**'
      - 'apps/electron/electron-builder.yml'
      - '.github/workflows/test-windows-bundled-tools.yml'
  workflow_dispatch:

jobs:
  test-windows-bundled-tools:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      - name: Install dependencies
        run: bun install
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Download bundled tools (MinGit + Python)
        run: |
          cd apps/electron
          bun run tools:download

      - name: Verify bundled tools
        run: |
          cd apps/electron
          node scripts/verify-bundled-tools.js

      - name: Type check
        run: bun run typecheck:all

      - name: Run tests
        run: bun test
