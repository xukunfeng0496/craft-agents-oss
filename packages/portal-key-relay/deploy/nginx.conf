# TLS reverse proxy in front of portal-key-relay (which listens on 127.0.0.1:8788).
# The desktop app calls https://<server_name>/api/resolve-key over Node fetch, which
# validates TLS — use a cert from your internal CA that desktops already trust
# (NOT self-signed). See docs/deployment/portal-key-relay.md.

server {
    listen 443 ssl;
    http2 on;
    server_name key-relay.example.gz.cvte.cn;   # <-- change to your intranet host

    ssl_certificate     /etc/ssl/cvte/key-relay.crt;   # <-- internal-CA cert (full chain)
    ssl_certificate_key /etc/ssl/cvte/key-relay.key;   # <-- private key (chmod 600)
    ssl_protocols       TLSv1.2 TLSv1.3;

    # The relay holds an admin-level credential — keep this server intranet-only.
    # Restrict to the desktop fleet's subnet(s); deny everything else.
    allow 10.0.0.0/8;        # <-- replace with your desktop network ranges
    deny  all;

    client_max_body_size 64k;   # resolve-key bodies are tiny

    location / {
        proxy_pass http://127.0.0.1:8788;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 30s;
    }
}

# Optional: redirect plain HTTP to HTTPS (or just close :80 at the firewall).
server {
    listen 80;
    server_name key-relay.example.gz.cvte.cn;
    return 308 https://$host$request_uri;
}
