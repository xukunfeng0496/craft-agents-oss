# nginx config for the docker-compose deploy (upstream = the `backend` service).
upstream session_share_backend {
    server backend:8787;
}

server {
    listen 443 ssl;
    server_name agents-viewer.gz.cvte.cn;   # <-- your intranet host (must equal enterprise.viewerUrl)

    ssl_certificate     /etc/nginx/certs/viewer.crt;
    ssl_certificate_key /etc/nginx/certs/viewer.key;

    root /var/www/craft-viewer/dist;
    client_max_body_size 25m;

    location = /s/api      { proxy_pass http://session_share_backend; proxy_set_header Host $host; }
    location ^~ /s/api/    { proxy_pass http://session_share_backend; proxy_set_header Host $host; }
    location ^~ /s/assets/ { rewrite ^/s/assets/(.*)$ /assets/$1 break; }
    location ^~ /s/        { try_files $uri /index.html; }
}
