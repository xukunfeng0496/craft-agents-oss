# Same-origin front for the CVTE session-share viewer.
# Serves the built apps/viewer SPA and proxies /s/api to the backend.
# Put apps/viewer/dist at /var/www/craft-viewer/dist and run the backend on :8787.

upstream session_share_backend {
    server 127.0.0.1:8787;
}

server {
    listen 443 ssl;
    server_name agents-viewer.gz.cvte.cn;   # <-- your intranet host (must equal enterprise.viewerUrl)

    # ssl_certificate     /etc/nginx/certs/viewer.crt;
    # ssl_certificate_key /etc/nginx/certs/viewer.key;

    root /var/www/craft-viewer/dist;
    client_max_body_size 25m;                # keep in sync with backend MAX_BYTES

    # 1) Storage API → backend (must precede the SPA fallback).
    location = /s/api      { proxy_pass http://session_share_backend; proxy_set_header Host $host; }
    location ^~ /s/api/    { proxy_pass http://session_share_backend; proxy_set_header Host $host; }

    # 2) Built assets live at dist/assets/* but are referenced as /s/assets/* (vite base '/s/').
    location ^~ /s/assets/ { rewrite ^/s/assets/(.*)$ /assets/$1 break; }

    # 3) Any other /s/* path is an SPA route (incl. /s/{id}) → index.html.
    location ^~ /s/        { try_files $uri /index.html; }
}
